name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Fail CI on critical production advisories. Known Next-bundled PostCSS
      # highs are documented in documentation/SECURITY.md until a planned Next upgrade.
      - name: Audit production dependencies (critical)
        run: npm run audit:prod
      - name: Audit production dependencies (report)
        run: npm audit --omit=dev --audit-level=high || true
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_DEMO_MODE: "true"
